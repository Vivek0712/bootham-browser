<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Bootham Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #tabs-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(to right, #1a0a2e, #2d1b4e, #1a0a2e);
      background-size: 200% 100%;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      height: 36px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      animation: waveMove 8s ease-in-out infinite;
    }

    @keyframes waveMove {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    #tabs-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(244, 114, 182, 0.15) 0%, transparent 50%);
      animation: wavePulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes wavePulse {
      0%, 100% {
        opacity: 0.5;
        transform: translateX(0);
      }
      50% {
        opacity: 1;
        transform: translateX(20px);
      }
    }

    #tabs-container {
      display: flex;
      flex: 1;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(168, 85, 247, 0.2);
      cursor: pointer;
      min-width: 150px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .tab.active {
      background: rgba(168, 85, 247, 0.3);
      color: white;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.4);
    }

    .tab:hover {
      background: rgba(168, 85, 247, 0.2);
      color: white;
    }

    .tab.active:hover {
      background: rgba(168, 85, 247, 0.35);
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      padding: 0 4px;
      border: none;
      background: transparent !important;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.6);
      box-shadow: none !important;
      min-width: auto !important;
    }

    .tab-close::before {
      display: none;
    }

    .tab-close:hover {
      color: #fca5a5;
      transform: none !important;
    }

    #new-tab-btn {
      padding: 6px 12px;
      border: none;
      background: linear-gradient(to bottom right, #fca5a5, #c084fc) !important;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    #new-tab-btn::before {
      background: linear-gradient(to bottom right, #c084fc, #fca5a5) !important;
    }

    #new-tab-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
    }

    #toolbar {
      display: flex;
      align-items: center;
      padding: 8px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      gap: 8px;
      height: 48px;
      flex-shrink: 0;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: linear-gradient(to bottom right, #fca5a5, #c084fc);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom right, #c084fc, #fca5a5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    button:hover:not(:disabled)::before {
      opacity: 1;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: linear-gradient(to bottom right, #9ca3af, #6b7280);
      box-shadow: none;
    }

    #back-btn, #forward-btn, #reload-btn {
      min-width: 40px;
    }

    #url-input {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #url-input:focus {
      outline: none;
      border-color: #0066cc;
    }

    #webview-container {
      flex: 1;
      position: relative;
      background: white;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }

    #webview-area {
      flex: 1;
      position: relative;
    }

    .webview-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .webview-wrapper.active {
      display: block;
    }

    /* Agent Mode Sidebar Styles */
    #agent-panel {
      position: relative;
      background: #0a0a0a;
      border-left: 2px solid rgba(236, 72, 153, 0.5);
      transition: width 0.3s ease;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: -5px 0 20px rgba(236, 72, 153, 0.2);
      width: 360px;
    }

    #agent-panel.hidden {
      width: 0;
      border-left: none;
      box-shadow: none;
    }

    .agent-canvas-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .agent-gradient-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .agent-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(236, 72, 153, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 72, 153, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    #agent-header {
      position: relative;
      text-align: center;
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
      z-index: 10;
    }

    .ghost-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.5));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .agent-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #ec4899, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.05em;
    }

    .agent-subtitle {
      font-size: 0.875rem;
      color: rgba(236, 72, 153, 0.8);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #agent-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent !important;
      color: rgba(236, 72, 153, 0.7);
      padding: 4px 8px;
      font-size: 18px;
      min-width: auto !important;
      box-shadow: none !important;
      z-index: 20;
    }

    #agent-close:hover {
      color: #ec4899;
      background: rgba(236, 72, 153, 0.1) !important;
    }

    .agent-status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: rgba(236, 72, 153, 0.1);
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 0.5rem;
      margin: 1.5rem 1.5rem 0;
      position: relative;
      z-index: 10;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ec4899;
      box-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.2);
      }
    }

    .status-text {
      font-size: 0.875rem;
      color: #ec4899;
      font-weight: 600;
    }

    #agent-log {
      position: relative;
      padding: 1.5rem;
      overflow-y: auto;
      height: calc(100vh - 400px);
      z-index: 10;
      color: rgba(255, 255, 255, 0.8);
    }

    #agent-panel.hidden #agent-log {
      opacity: 0;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      word-wrap: break-word;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-system {
      background: rgba(34, 197, 94, 0.1);
      color: #86efac;
      border-left: 3px solid #22c55e;
    }

    .log-assistant {
      background: rgba(168, 85, 247, 0.1);
      color: #e9d5ff;
      border-left: 3px solid #a855f7;
    }

    .log-user {
      background: rgba(236, 72, 153, 0.1);
      color: #fca5a5;
      border-left: 3px solid #ec4899;
    }

    .log-error {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border-left: 3px solid #ef4444;
    }

    #agent-input-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.5rem;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.98), transparent);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(236, 72, 153, 0.2);
      z-index: 20;
    }

    #agent-prompt {
      width: 100%;
      padding: 0.75rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 0.5rem;
      color: white;
      font-size: 0.875rem;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
      margin-bottom: 0.75rem;
      min-height: 60px;
    }

    #agent-prompt::placeholder {
      color: rgba(236, 72, 153, 0.5);
    }

    #agent-prompt:focus {
      border-color: rgba(236, 72, 153, 0.6);
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
    }

    #agent-controls {
      display: flex;
      gap: 8px;
    }

    #agent-submit, #agent-stop {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      color: white;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    #agent-submit {
      background: linear-gradient(to right, #ec4899, #a855f7);
      box-shadow: 0 2px 10px rgba(236, 72, 153, 0.3);
    }

    #agent-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.5);
    }

    #agent-submit:active {
      transform: translateY(0);
    }

    #agent-stop {
      background: linear-gradient(to right, #ef4444, #dc2626);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.3);
    }

    #agent-stop:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
    }

    #agent-toggle {
      background: linear-gradient(to bottom right, #ec4899, #a855f7) !important;
      min-width: 120px;
    }

    #agent-toggle::before {
      background: linear-gradient(to bottom right, #a855f7, #ec4899) !important;
    }

    .user-question {
      background: rgba(236, 72, 153, 0.15);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(236, 72, 153, 0.4);
    }

    .user-question-text {
      font-weight: 600;
      margin-bottom: 8px;
      color: #fca5a5;
    }

    .user-question input {
      width: 100%;
      padding: 8px;
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .user-question input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
    }

    .user-question button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: linear-gradient(to right, #ec4899, #a855f7);
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="tabs-bar">
    <div id="tabs-container"></div>
    <button id="new-tab-btn" title="New Tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back-btn" disabled>←</button>
    <button id="forward-btn" disabled>→</button>
    <button id="reload-btn">⟳</button>
    <input type="text" id="url-input" placeholder="Enter URL...">
    <button id="agent-toggle">🤖 Agent Mode</button>
  </div>
  <div id="webview-container">
    <div id="webview-area"></div>
    <div id="agent-panel" class="hidden">
      <div class="agent-canvas-wrapper">
        <div class="agent-gradient-overlay"></div>
        <div class="agent-grid-pattern"></div>
      </div>
      <button id="agent-close">×</button>
      <div id="agent-header">
        <div class="ghost-icon">👻</div>
        <h2 class="agent-title">Agent Mode</h2>
        <p class="agent-subtitle">AI-Powered Automation</p>
      </div>
      <div class="agent-status">
        <div class="status-indicator"></div>
        <span class="status-text">Ready</span>
      </div>
      <div id="agent-log"></div>
      <div id="agent-input-container">
        <textarea id="agent-prompt" placeholder="Enter your prompt for the AI agent..."></textarea>
        <div id="agent-controls">
          <button id="agent-submit">🚀 Execute</button>
          <button id="agent-stop" style="display: none;">⏹ Stop</button>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
