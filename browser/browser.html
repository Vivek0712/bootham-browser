<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Bootham Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #tabs-bar {
      display: flex;
      align-items: center;
      background: linear-gradient(to right, #1a0a2e, #2d1b4e, #1a0a2e);
      background-size: 200% 100%;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      height: 36px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      animation: waveMove 8s ease-in-out infinite;
    }

    @keyframes waveMove {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    #tabs-bar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(244, 114, 182, 0.15) 0%, transparent 50%);
      animation: wavePulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes wavePulse {
      0%, 100% {
        opacity: 0.5;
        transform: translateX(0);
      }
      50% {
        opacity: 1;
        transform: translateX(20px);
      }
    }

    #tabs-container {
      display: flex;
      flex: 1;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(168, 85, 247, 0.2);
      cursor: pointer;
      min-width: 150px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .tab.active {
      background: rgba(168, 85, 247, 0.3);
      color: white;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.4);
    }

    .tab:hover {
      background: rgba(168, 85, 247, 0.2);
      color: white;
    }

    .tab.active:hover {
      background: rgba(168, 85, 247, 0.35);
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      padding: 0 4px;
      border: none;
      background: transparent !important;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.6);
      box-shadow: none !important;
      min-width: auto !important;
    }

    .tab-close::before {
      display: none;
    }

    .tab-close:hover {
      color: #fca5a5;
      transform: none !important;
    }

    #new-tab-btn {
      padding: 6px 12px;
      border: none;
      background: linear-gradient(to bottom right, #fca5a5, #c084fc) !important;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    #new-tab-btn::before {
      background: linear-gradient(to bottom right, #c084fc, #fca5a5) !important;
    }

    #new-tab-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
    }

    #toolbar {
      display: flex;
      align-items: center;
      padding: 8px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      gap: 8px;
      height: 48px;
      flex-shrink: 0;
    }

    button {
      padding: 6px 12px;
      border: none;
      background: linear-gradient(to bottom right, #fca5a5, #c084fc);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: white;
      font-weight: 500;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom right, #c084fc, #fca5a5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    button:hover:not(:disabled)::before {
      opacity: 1;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: linear-gradient(to bottom right, #9ca3af, #6b7280);
      box-shadow: none;
    }

    #back-btn, #forward-btn, #reload-btn {
      min-width: 40px;
    }

    #url-input {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #url-input:focus {
      outline: none;
      border-color: #0066cc;
    }

    #webview-container {
      flex: 1;
      position: relative;
      background: white;
      min-height: 0;
    }

    .webview-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .webview-wrapper.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="tabs-bar">
    <div id="tabs-container"></div>
    <button id="new-tab-btn" title="New Tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back-btn" disabled>←</button>
    <button id="forward-btn" disabled>→</button>
    <button id="reload-btn">⟳</button>
    <input type="text" id="url-input" placeholder="Enter URL...">
  </div>
  <div id="webview-container"></div>
  <script src="renderer.js"></script>
</body>
</html>
