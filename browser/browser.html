<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Minimal Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      display: flex;
      align-items: center;
      padding: 8px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      gap: 8px;
      height: 48px;
      flex-shrink: 0;
    }

    button {
      padding: 6px 12px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover:not(:disabled) {
      background: #e9e9e9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #url-input {
      flex: 1;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #url-input:focus {
      outline: none;
      border-color: #0066cc;
    }

    #webview-container {
      flex: 1;
      position: relative;
      background: white;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="back-btn" disabled>←</button>
    <button id="forward-btn" disabled>→</button>
    <button id="reload-btn">⟳</button>
    <input type="text" id="url-input" placeholder="Enter URL...">
  </div>
  <div id="webview-container">
    <webview id="webview" src="about:blank"></webview>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
