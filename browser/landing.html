<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bootham Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .lamp-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lamp-light {
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(
        circle,
        rgba(168, 85, 247, 0.4) 0%,
        rgba(244, 114, 182, 0.3) 25%,
        rgba(251, 113, 133, 0.2) 50%,
        transparent 70%
      );
      filter: blur(60px);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: translateX(-50%) scale(1);
      }
      50% {
        opacity: 0.8;
        transform: translateX(-50%) scale(1.1);
      }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(100px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 4rem;
      font-weight: 600;
      background: linear-gradient(
        to bottom right,
        #fca5a5,
        #c084fc
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="lamp-container">
    <div class="lamp-light"></div>
    <div class="content">
      <h1>Bootham Browser</h1>
      <p class="subtitle">Browse the web with style</p>
    </div>
  </div>
</body>
</html>
